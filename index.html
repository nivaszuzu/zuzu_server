<!-- Place this right below your existing pink Package Items (Multi-Select) card and above "Package Details / Inclusions" -->
<div id="additionalDayPackagesContainer" style="margin-top: 14px;"></div>

<div style="margin: 12px 0 18px 0;">
  <button
    type="button"
    id="addDayPackageBtn"
    style="
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px dashed #f43f5e;
      background: #fff1f2;
      color: #e11d48;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    "
  >
    + Add Package for Day 2 / Another Event
  </button>
</div>

<style>
  .day-pkg-card {
    background: #fff5f7;
    border: 1px solid #fecdd3;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .day-pkg-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .day-pkg-title {
    font-weight: 700;
    font-size: 0.95rem;
    color: #111827;
  }
  .day-pkg-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .day-pkg-chip {
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    background: #ffffff;
    color: #111827;
    font-weight: 500;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .day-pkg-chip.selected {
    background: #f43f5e;
    border-color: #f43f5e;
    color: #ffffff;
    font-weight: 600;
  }
  .day-pkg-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .day-pkg-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    background: #ffffff;
    font-size: 0.95rem;
    margin-top: 4px;
  }
</style>

<script>
  (function () {
    const container = document.getElementById('additionalDayPackagesContainer');
    const addBtn = document.getElementById('addDayPackageBtn');

    // Match your studio's package list & default prices
    const PACKAGE_OPTIONS = [
      { name: 'Basic', price: 8000 },
      { name: 'HD', price: 15000 },
      { name: 'Premium', price: 20000 },
      { name: 'Luxury', price: 28000 },
      { name: 'Bridesmaid', price: 3500 },
      { name: 'Groom', price: 4000 }
    ];

    let dayCounter = 1; // Day 1 is your existing top card

    function createDayPackageCard(dayNumber) {
      const card = document.createElement('div');
      card.className = 'day-pkg-card';
      card.dataset.day = dayNumber;

      const selectedSet = new Set();

      card.innerHTML = `
        <div class="day-pkg-header">
          <span class="day-pkg-title">Day ${dayNumber} — Package Items (Multi-Select)</span>
          <button type="button" class="remove-day-pkg" style="background:none;border:none;color:#e11d48;font-size:0.82rem;font-weight:600;cursor:pointer;">
            Remove
          </button>
        </div>

        <div class="day-pkg-chips">
          ${PACKAGE_OPTIONS.map(
            (p) =>
              `<button type="button" class="day-pkg-chip" data-name="${p.name}" data-price="${p.price}">+ ${p.name}</button>`
          ).join('')}
        </div>

        <div class="day-pkg-grid">
          <div>
            <label style="font-size:0.82rem;font-weight:600;color:#374151;">Day ${dayNumber} Package Price (₹)</label>
            <input type="number" class="day-pkg-input day-price-input" value="0" min="0" />
          </div>
          <div>
            <label style="font-size:0.82rem;font-weight:600;color:#374151;">Day ${dayNumber} Discount (₹) (Optional)</label>
            <input type="number" class="day-pkg-input day-discount-input" value="0" min="0" />
          </div>
        </div>
      `;

      const priceInput = card.querySelector('.day-price-input');
      const discountInput = card.querySelector('.day-discount-input');
      const chips = card.querySelectorAll('.day-pkg-chip');

      chips.forEach((chip) => {
        chip.addEventListener('click', () => {
          const name = chip.dataset.name;
          const price = Number(chip.dataset.price || 0);

          if (selectedSet.has(name)) {
            selectedSet.delete(name);
            chip.classList.remove('selected');
            chip.textContent = `+ ${name}`;
            priceInput.value = Math.max(0, Number(priceInput.value || 0) - price);
          } else {
            selectedSet.add(name);
            chip.classList.add('selected');
            chip.textContent = `✓ ${name}`;
            priceInput.value = Number(priceInput.value || 0) + price;
          }
          syncAllDaysSummary();
        });
      });

      priceInput.addEventListener('input', syncAllDaysSummary);
      discountInput.addEventListener('input', syncAllDaysSummary);

      card.querySelector('.remove-day-pkg').addEventListener('click', () => {
        card.remove();
        renumberDayCards();
        syncAllDaysSummary();
      });

      return card;
    }

    function renumberDayCards() {
      const cards = container.querySelectorAll('.day-pkg-card');
      dayCounter = 1;
      cards.forEach((card) => {
        dayCounter++;
        card.dataset.day = dayCounter;
        card.querySelector('.day-pkg-title').textContent = `Day ${dayCounter} — Package Items (Multi-Select)`;
        const labels = card.querySelectorAll('label');
        labels[0].textContent = `Day ${dayCounter} Package Price (₹)`;
        labels[1].textContent = `Day ${dayCounter} Discount (₹) (Optional)`;
      });
      addBtn.textContent = `+ Add Package for Day ${dayCounter + 1} / Another Event`;
    }

    function syncAllDaysSummary() {
      const extraDays = [];
      container.querySelectorAll('.day-pkg-card').forEach((card) => {
        const selected = Array.from(card.querySelectorAll('.day-pkg-chip.selected')).map((c) => c.dataset.name);
        const price = Number(card.querySelector('.day-price-input').value || 0);
        const discount = Number(card.querySelector('.day-discount-input').value || 0);
        extraDays.push({
          day: Number(card.dataset.day),
          packages: selected,
          price,
          discount
        });
      });

      // Read this in your "+ Save Booking" handler to combine Day 1 + Day 2+ totals
      window.extraDayPackages = extraDays;
    }

    addBtn.addEventListener('click', () => {
      dayCounter++;
      const card = createDayPackageCard(dayCounter);
      container.appendChild(card);
      addBtn.textContent = `+ Add Package for Day ${dayCounter + 1} / Another Event`;
      syncAllDaysSummary();
    });

    // Optional: automatically add Day 2 package card when user clicks "+ Add Day" at the top
    document.querySelectorAll('button').forEach((btn) => {
      if (btn.textContent.trim().includes('+ Add Day')) {
        btn.addEventListener('click', () => {
          addBtn.click();
        });
      }
    });
  })();
</script>
