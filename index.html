<!-- Add this inside your PACKAGE, EXTRAS & DISCOUNT card, right above the divider line -->
<div id="extra-package-slot" style="margin-top: 16px; padding-top: 14px; border-top: 1px dashed #e5e7eb;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
    <span style="font-size: 0.85rem; font-weight: 600; color: #374151;">
      Additional Package / Serial #2 — Selected Packages (Tap to toggle)
    </span>
    <button type="button" id="clearPkg2Btn" style="font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; cursor: pointer;">
      Clear Slot #2
    </button>
  </div>

  <!-- Second toggle chips bar -->
  <div id="pkg2Chips" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;">
    <button type="button" class="pkg2-chip" data-pkg="Bride" data-price="10000">+ Bride</button>
    <button type="button" class="pkg2-chip" data-pkg="HD" data-price="8000">+ HD</button>
    <button type="button" class="pkg2-chip" data-pkg="Basic" data-price="5000">+ Basic</button>
    <button type="button" class="pkg2-chip" data-pkg="Premium" data-price="15000">+ Premium</button>
    <button type="button" class="pkg2-chip" data-pkg="Luxury" data-price="22000">+ Luxury</button>
    <button type="button" class="pkg2-chip" data-pkg="Bridesmaid" data-price="3500">+ Bridesmaid</button>
    <button type="button" class="pkg2-chip" data-pkg="Groom" data-price="4000">+ Groom</button>
  </div>

  <!-- Second package label, serial/tag, and amount row -->
  <div style="display: grid; grid-template-columns: 1.5fr 1fr 1fr auto; gap: 10px; align-items: end;">
    <div>
      <label style="display: block; font-size: 0.78rem; color: #6b7280; margin-bottom: 4px;">
        Second Package Label
      </label>
      <input
        type="text"
        id="pkg2Label"
        placeholder="e.g. HD + Bride (Serial #2)"
        style="width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px;"
      />
    </div>

    <div>
      <label style="display: block; font-size: 0.78rem; color: #6b7280; margin-bottom: 4px;">
        Amount (₹)
      </label>
      <input
        type="number"
        id="pkg2Amount"
        value="0"
        min="0"
        style="width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px;"
      />
    </div>

    <div>
      <label style="display: block; font-size: 0.78rem; color: #6b7280; margin-bottom: 4px;">
        Notes / Serial
      </label>
      <input
        type="text"
        id="pkg2Notes"
        placeholder="e.g. Reception / Slot 2"
        style="width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px;"
      />
    </div>

    <button
      type="button"
      id="applyPkg2Btn"
      style="padding: 9px 16px; border: none; border-radius: 8px; background: #e11d48; color: #fff; font-weight: 600; cursor: pointer;"
    >
      Update Total
    </button>
  </div>
</div>

<style>
  .pkg2-chip {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    background: #fff;
    color: #111827;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .pkg2-chip.active {
    background: #ffe4e6;
    border-color: #e11d48;
    color: #be123c;
    font-weight: 600;
  }
</style>

<script>
  (function () {
    const chips = document.querySelectorAll('.pkg2-chip');
    const labelInput = document.getElementById('pkg2Label');
    const amountInput = document.getElementById('pkg2Amount');
    const clearBtn = document.getElementById('clearPkg2Btn');
    const applyBtn = document.getElementById('applyPkg2Btn');

    // Adjust these selectors if your existing inputs/displays use different IDs
    const basePriceInput = document.querySelector('input[value="20000"]') || document.getElementById('basePrice');
    const discountInput = document.querySelector('input[value="2000"]') || document.getElementById('discount');

    let selectedPkgs2 = new Map();

    function syncPkg2Fields() {
      const names = Array.from(selectedPkgs2.keys());
      const totalAmt = Array.from(selectedPkgs2.values()).reduce((sum, v) => sum + v, 0);

      if (names.length > 0) {
        labelInput.value = names.join(' + ');
        amountInput.value = totalAmt;
      }
      recalculateBilling();
    }

    function recalculateBilling() {
      const pkg1Base = Number(basePriceInput?.value || 0);
      const pkg2Base = Number(amountInput?.value || 0);
      const discount = Number(discountInput?.value || 0);

      // If you already track extra costs in state/DOM, include them here:
      const extraCost = Number(window.currentExtraCostTotal || 0);

      const basePlusExtra = pkg1Base + pkg2Base + extraCost;
      const netTotal = Math.max(0, basePlusExtra - discount);

      // Update visible totals if matched by text or ID
      document.querySelectorAll('*').forEach((el) => {
        if (el.children.length === 0 && el.textContent.trim().startsWith('₹')) {
          const parentText = el.parentElement?.textContent || '';
          if (parentText.includes('Base + Extra')) {
            el.textContent = '₹' + basePlusExtra.toLocaleString('en-IN');
          } else if (parentText.includes('Net Total')) {
            el.textContent = '₹' + netTotal.toLocaleString('en-IN');
          }
        }
      });

      // Expose combined package data so your Save / Invoice / WhatsApp handler can read it
      window.billingPackagesState = {
        package1Label: document.querySelector('input[value="Custom Package"]')?.value || 'Custom Package',
        package1Amount: pkg1Base,
        package2Label: labelInput.value.trim(),
        package2Amount: pkg2Base,
        package2Notes: document.getElementById('pkg2Notes').value.trim(),
        discount,
        basePlusExtra,
        netTotal
      };
    }

    chips.forEach((chip) => {
      chip.addEventListener('click', () => {
        const pkgName = chip.dataset.pkg;
        const pkgPrice = Number(chip.dataset.price || 0);

        if (selectedPkgs2.has(pkgName)) {
          selectedPkgs2.delete(pkgName);
          chip.classList.remove('active');
        } else {
          selectedPkgs2.set(pkgName, pkgPrice);
          chip.classList.add('active');
        }
        syncPkg2Fields();
      });
    });

    clearBtn.addEventListener('click', () => {
      selectedPkgs2.clear();
      chips.forEach((c) => c.classList.remove('active'));
      labelInput.value = '';
      amountInput.value = '0';
      document.getElementById('pkg2Notes').value = '';
      recalculateBilling();
    });

    amountInput.addEventListener('input', recalculateBilling);
    applyBtn.addEventListener('click', recalculateBilling);
    basePriceInput?.addEventListener('input', recalculateBilling);
    discountInput?.addEventListener('input', recalculateBilling);
  })();
</script>
